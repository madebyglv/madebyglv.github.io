<!-- ======== PASSWORD-PROTECTED CV ======== -->
<main class="cvp">
  <div class="wrap">
    <div class="cvbox">
      <small class="cv-lab">Private page</small>
      <h2>CV</h2>
      <p>This page is protected. Enter the password I sent you to download my CV.</p>

      <div id="lock">
        <label class="cv-sr" for="pw">Password</label>
        <input id="pw" class="cv-pw" type="password" autocomplete="off" placeholder="Password">
        <button class="btn p" id="go">Unlock</button>
        <p class="cv-msg" id="msg" role="status" aria-live="polite"></p>
      </div>

      <div id="done" hidden>
        <p class="cv-ok">Unlocked ✓</p>
        <div class="cta">
          <a class="btn p" id="dl">Download CV ↓</a>
          <a class="btn" id="view" target="_blank" rel="noopener" hidden>Open in browser ↗</a>
        </div>
      </div>
    </div>
  </div>
</main>
